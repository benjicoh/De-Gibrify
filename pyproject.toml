[tool.poetry]
name = "knowledge-chat-app"
version = "0.2.0"
description = "Web app to chat with a knowledgebase via LLM"
authors = ["Jules"]

[tool.poetry.dependencies]
python = "^3.13"
langchain = "^0.3.0"
langchain-community = "^0.3.0"
langgraph = "^0.2.0"
langserve = {extras = ["all"], version = "^0.3.0"}
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
sentence-transformers = "^3.0.0"
faiss-cpu = "^1.8.0"
requests = "^2.32.0"
pydantic = "^2.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
