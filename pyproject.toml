[tool.poetry]
name = "knowledge-chat-app"
version = "0.1.0"
description = "Web app to chat with a knowledgebase via LLM"
authors = ["Jules"]

[tool.poetry.dependencies]
python = "^3.10"
langchain = "^0.1.0"
langchain-community = "^0.0.10"
langgraph = "^0.0.10"
langserve = {extras = ["all"], version = "^0.0.30"}
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
sentence-transformers = "^2.2.2"
faiss-cpu = "^1.7.4"
requests = "^2.31.0"
pydantic = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
